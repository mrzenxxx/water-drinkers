# WaterDrinkers — GraphQL-схема.
# Дословно повторяет docs/SPEC.md §10.2.
#
# Дополнения к §10.2 (в спецификации типы упомянуты, но не расписаны — без них
# схема не собирается): RequestCodeResult, AuthResult, AuditEntry,
# AssistantMessage и скаляр JSON для полей before/after журнала аудита.

scalar Date # YYYY-MM-DD
scalar DateTime # ISO 8601
scalar Money # копейки, целое число
scalar JSON # произвольный JSON (before/after в журнале аудита)

enum Role {
  PARTICIPANT
  ADMIN
}

enum ContributionStatus {
  PENDING
  CONFIRMED
  REJECTED
}

enum Confidence {
  HIGH
  MEDIUM
  LOW
}

enum AbsenceType {
  VACATION
  SICK_LEAVE
}

# ─── Участники ───────────────────────────────────────────

type User {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  role: Role!
  joinedAt: Date!
  leftAt: Date
  isActive: Boolean!
  openingBalance: Money!
  balance: Balance!
  absences: [Absence!]!
  contributions(status: ContributionStatus): [Contribution!]!
}

type Balance {
  user: User!
  amount: Money! # < 0 → участник должен
  owes: Boolean!
  breakdown: BalanceBreakdown!
}

"Раскрытие баланса — то, что показывает экран «Фонд» по клику"
type BalanceBreakdown {
  openingBalance: Money!
  contributionsTotal: Money!
  expensesTotal: Money! # положительная величина: сумма долей в заказах
  settlementsTotal: Money! # знаковая: выплата отрицательна (§2.3)
  adjustmentsTotal: Money! # знаковая: корректировка бывает в обе стороны
  orderShares: [OrderShare!]!
}

type OrderShare {
  order: WaterOrder!
  daysPresent: Int!
  totalPersonDays: Int!
  share: Money!
}

# ─── Фонд ────────────────────────────────────────────────

type Fund {
  balance: Money!
  openingBalance: Money!
  startDate: Date
  defaultContribution: Money!
  balancesSum: Money! # для проверки инварианта
  isConsistent: Boolean! # balance == balancesSum
  monthlyStats: [MonthlyStat!]!
}

type MonthlyStat {
  month: String! # YYYY-MM
  contributions: Money!
  orders: Money! # отрицательная: деньги ушли из фонда (§2.3)
  endBalance: Money!
}

# ─── Взносы ──────────────────────────────────────────────

type Contribution {
  id: ID!
  user: User!
  amount: Money!
  paidAt: Date!
  status: ContributionStatus!
  receipt: Receipt
  submittedAt: DateTime!
  reviewedBy: User
  reviewedAt: DateTime
  reviewComment: String
  needsAttention: Boolean! # низкая уверенность или расхождение с чеком
}

type Receipt {
  id: ID!
  "/api/receipts/:id — ссылка на приложение, а не на хранилище (§8.4)"
  url: String!
  mediaType: String!
  "Размер файла в байтах: для подписи кнопки «PDF · 1,2 МБ»"
  byteSize: Int!
  extraction: ReceiptExtraction
}

type ReceiptExtraction {
  paidAt: Date
  amount: Money
  payerHint: String
  confidence: Confidence!
  notes: String!
  provider: String!
}

# ─── Заказы и отсутствия ─────────────────────────────────

type WaterOrder {
  id: ID!
  amount: Money!
  orderedAt: Date!
  bottlesCount: Int
  supplier: String
  note: String
  createdBy: User!
  receipt: Receipt
  consumptionPeriodEnd: Date # null → период ещё открыт
  shares: [OrderShare!]!
}

type Absence {
  id: ID!
  user: User!
  type: AbsenceType!
  startsOn: Date!
  endsOn: Date!
  note: String
}

# ─── Объявления ──────────────────────────────────────────

"""
Сообщение администратора всем участникам (§6.12): инструкция по пользованию
системой или новость про кассу.

Событием фонда объявление не является: денег не несёт, в расчёт балансов
не входит и в ленту §6.9 не попадает. Отдельный тип именно поэтому.
"""
type Announcement {
  id: ID!
  title: String!
  body: String!
  "Закреплённое не тонет в списке — так живут инструкции."
  pinned: Boolean!
  "null — черновик: виден только администратору."
  publishedAt: DateTime
  "Снято с глаз, но не удалено."
  archivedAt: DateTime
  updatedAt: DateTime!
  author: User!
  "Опубликовано после последнего захода текущего участника в раздел."
  isNew: Boolean!
  "Приложенная картинка; null — её нет."
  image: AnnouncementImage
}

"""
Картинка объявления.

Отдаётся ссылкой на приложение, а не на хранилище: байты лежат в базе, и
менять это решение не должно означать правку схемы и клиента. Размеры — чтобы
страница резервировала место и не дёргалась, когда картинка догрузится.
"""
type AnnouncementImage {
  url: String!
  "Описание для тех, кто картинку не видит. Обязательно (§12)."
  alt: String!
  mediaType: String!
  width: Int!
  height: Int!
}

"""
Картинка на загрузку.

Байты приходят в base64: у GraphQL нет своего способа передать файл, а заводить
второй путь записи ради одного поля значило бы развести проверки прав и формата
по двум местам. Тип определяется по сигнатуре файла — `mediaType` лишь сверяется.
"""
input AnnouncementImageInput {
  base64: String!
  mediaType: String
  alt: String!
}

"""
Файл чека на загрузку (§8.4).

Байты приходят в base64: у GraphQL нет своего способа передать файл. Тип
определяется по сигнатуре файла — `mediaType` лишь сверяется.
"""
input ReceiptFileInput {
  "У GraphQL нет своего способа передать файл"
  base64: String!
  "Только сверяется: решает сигнатура файла (§8.4)"
  mediaType: String
}

input AnnouncementInput {
  title: String!
  body: String!
  pinned: Boolean = false
  "false — сохранить черновиком; повторное false снимает с публикации."
  published: Boolean = true
}

# ─── Аудит и помощник ────────────────────────────────────

"Запись журнала аудита (audit_log, §11). В §10.2 тип упомянут, но не расписан."
type AuditEntry {
  id: ID!
  actor: User
  action: String!
  entity: String!
  entityId: ID
  before: JSON
  after: JSON
  createdAt: DateTime!
}

"Сообщение диалога с помощником (assistant_messages, §11)."
type AssistantMessage {
  id: ID!
  role: String! # user | assistant
  content: String!
  createdAt: DateTime!
}

# ─── Результаты аутентификации ───────────────────────────

"""
Ответ на запрос кода. По §7 он одинаков для разрешённого и неразрешённого
адреса, поэтому не содержит ничего, что раскрывало бы состав команды.
"""
type RequestCodeResult {
  ok: Boolean!
  expiresInSeconds: Int!
}

"Результат проверки кода. Сессия уходит в httpOnly-cookie, а не в ответ."
type AuthResult {
  user: User!
  needsProfile: Boolean! # первый вход: не заполнены имя и фамилия
}

# ─── Запросы ─────────────────────────────────────────────

type Query {
  me: User
  fund: Fund!
  participants(includeInactive: Boolean = false): [User!]!
  balances: [Balance!]!
  contributions(
    userId: ID
    status: ContributionStatus
    from: Date
    to: Date
  ): [Contribution!]!
  waterOrders(from: Date, to: Date): [WaterOrder!]!
  absences(from: Date, to: Date, type: AbsenceType): [Absence!]!
  pendingContributions: [Contribution!]! # только ADMIN
  auditLog(limit: Int = 50): [AuditEntry!]! # только ADMIN
  assistantThread: [AssistantMessage!]!

  # Объявления (§6.12). Черновики и архив приходят только администратору:
  # includeHidden от участника — ошибка доступа, а не молча пустой список.
  announcements(includeHidden: Boolean = false): [Announcement!]!
  unreadAnnouncements: Int!
}

# ─── Мутации ─────────────────────────────────────────────

type Mutation {
  # Аутентификация
  requestLoginCode(email: String!): RequestCodeResult!
  verifyLoginCode(email: String!, code: String!): AuthResult!
  logout: Boolean!
  updateProfile(firstName: String!, lastName: String!): User!

  # Чеки (§8.4)
  uploadReceipt(file: ReceiptFileInput!): Receipt!

  # Взносы
  extractReceipt(fileId: ID!): ReceiptExtraction!
  submitContribution(amount: Money!, paidAt: Date!, receiptFileId: ID): Contribution!
  confirmContribution(id: ID!): Contribution! # ADMIN
  rejectContribution(id: ID!, comment: String!): Contribution! # ADMIN

  # Заказы
  createWaterOrder(input: WaterOrderInput!): WaterOrder! # ADMIN

  # Отсутствия
  addAbsence(type: AbsenceType!, startsOn: Date!, endsOn: Date!, note: String): Absence!
  deleteAbsence(id: ID!): Boolean!

  # Администрирование
  setOpeningBalances(input: OpeningBalancesInput!): Fund! # ADMIN
  addParticipant(email: String!, joinedAt: Date!, openingBalance: Money = 0): User! # ADMIN
  deactivateParticipant(id: ID!, leftAt: Date!): User! # ADMIN
  reactivateParticipant(id: ID!): User! # ADMIN
  setParticipantRole(id: ID!, role: Role!): User! # ADMIN
  settleParticipant(id: ID!, amount: Money!, note: String!): User! # ADMIN
  createAdjustment(userId: ID, amount: Money!, comment: String!): Fund! # ADMIN

  # Ввод за участника (§6.7)
  addContributionFor(input: ContributionForInput!): Contribution! # ADMIN
  addAbsenceFor(input: AbsenceForInput!): Absence! # ADMIN

  # Объявления (§6.12)
  createAnnouncement(input: AnnouncementInput!): Announcement! # ADMIN
  updateAnnouncement(id: ID!, input: AnnouncementInput!): Announcement! # ADMIN
  setAnnouncementArchived(id: ID!, archived: Boolean!): Announcement! # ADMIN
  "Приложить картинку или убрать её (null). Только ADMIN."
  setAnnouncementImage(id: ID!, image: AnnouncementImageInput): Announcement!
  """
  Отметить раздел просмотренным. Возвращает новый момент отсчёта; null —
  объявлений нет вовсе, и отмечать нечего.
  """
  markAnnouncementsSeen: DateTime

  # Помощник
  askAssistant(question: String!): AssistantMessage!
}

input OpeningBalancesInput {
  startDate: Date!
  fundOpeningBalance: Money!
  openingBalances: [OpeningBalanceInput!]!
  """
  Кнопка «Распределить поровну» (§4.2): доли считает сервер методом наибольших
  остатков, а в журнал аудита идёт пометка equal-split. Переданные вручную
  значения при этом игнорируются — иначе непонятно, какое из двух правил главнее.
  """
  equalSplit: Boolean = false
}

input OpeningBalanceInput {
  userId: ID!
  amount: Money!
}

"Взнос, внесённый администратором за участника (§6.7). Подтверждение всё равно требуется."
input ContributionForInput {
  userId: ID!
  amount: Money!
  paidAt: Date!
  receiptFileId: ID
}

"Отсутствие, внесённое администратором за участника (§6.7)."
input AbsenceForInput {
  userId: ID!
  type: AbsenceType!
  startsOn: Date!
  endsOn: Date!
  note: String
}

input WaterOrderInput {
  amount: Money!
  orderedAt: Date!
  bottlesCount: Int
  supplier: String
  note: String
  """
  Обязателен: поставка без подтверждения оплаты не отмечается (§6.5).
  Колонка в базе остаётся NULL-разрешающей ради заказов, заведённых раньше.
  """
  receiptFileId: ID!
}

type Subscription {
  fundUpdated: Fund! # опционально, этап 1.5
}
