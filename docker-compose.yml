# Локальная база для разработки.
#
# Порт снаружи — 5433, а не привычный 5432: на машине разработки 5432 уже занят
# базой соседнего проекта, и чужой контейнер ради нашего останавливать незачем.
# Внутри контейнера порт обычный, так что строка подключения отличается от
# стандартной ровно одной цифрой.
#
# Расширения citext и btree_gist (§11) ставит начальная миграция; в официальном
# образе они уже лежат в поставке, отдельный образ не нужен.

services:
  postgres:
    image: postgres:17-alpine
    container_name: waterdrinkers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: waterdrinkers
      POSTGRES_PASSWORD: waterdrinkers
      POSTGRES_DB: waterdrinkers
    ports:
      - '5433:5432'
    volumes:
      - waterdrinkers-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Без этого `migrate deploy` сразу после `up` попадает в момент, когда
      # порт уже слушают, а база ещё поднимается.
      test: ['CMD-SHELL', 'pg_isready -U waterdrinkers -d waterdrinkers']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  waterdrinkers-pgdata:
